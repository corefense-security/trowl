BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "trowl"
BBFILE_PATTERN_trowl = "^${LAYERDIR}/"
BBFILE_PRIORITY_trowl = "6"

LAYERDEPENDS_trowl = "core"
LAYERSERIES_COMPAT_trowl = "scarthgap wrynose"

# The models Trowl can run, as file, URL and SHA-256 like internal/llm/llm.go lists them.
# The trowl class and trowl-model-native both read this.
TROWL_LLM_MODEL ??= "qwen3.5-4b"
