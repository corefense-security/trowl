- option: HARDENED_USERCOPY
  expect: y
  since: "4.8"
  why: Bounds-checks copies between kernel and user memory against the object's real size
  ref: mainline
- option: FORTIFY_SOURCE
  expect: y
  since: "4.13"
  why: Compile- and run-time bounds checks on kernel string and memory functions
  ref: mainline
- option: LIST_HARDENED
  expect: y
  since: "6.6"
  why: Detects corrupted linked-list pointers before they are followed
  ref: mainline
- option: INIT_ON_ALLOC_DEFAULT_ON
  expect: y
  since: "5.3"
  why: Zeroes heap and page allocations, so stale data can't leak through new objects
  ref: mainline
- option: INIT_ON_FREE_DEFAULT_ON
  expect: y
  since: "5.3"
  why: Wipes memory when freed, shrinking use-after-free and info-leak windows
  ref: mainline
- option: INIT_STACK_ALL_ZERO
  expect: y
  since: "5.9"
  why: Zero-initialises stack variables, removing uninitialised-stack leaks (needs compiler support)
  ref: mainline
- option: KSTACK_ERASE
  expect: y
  since: "6.17"
  why: Clears the kernel stack on return to user space
  ref: mainline
- option: SECURITY_DMESG_RESTRICT
  expect: y
  why: Hides the kernel log from unprivileged users, who could read kernel addresses from it
  ref: KSPP
- option: SECURITY_YAMA
  expect: y
  why: Restricts ptrace to a process's own descendants by default
  ref: KSPP
- option: HARDENED_USERCOPY_DEFAULT_ON
  expect: y
  since: '6.15'
  why: Enables usercopy bounds checks by default
  ref: KSPP
- option: PROC_MEM_NO_FORCE
  expect: y
  why: Prevents /proc/pid/mem writes from bypassing read-only mappings
  ref: KSPP
- option: SECCOMP
  expect: y
  why: Allows processes to restrict their available system calls
  ref: KSPP
- option: SECCOMP_FILTER
  expect: y
  why: Allows BPF filters to restrict system calls and their arguments
  ref: KSPP
- option: SECURITY
  expect: y
  why: Enables the Linux Security Module framework
  ref: KSPP
- option: SECURITY_LANDLOCK
  expect: y
  why: Provides Landlock rules for applications to restrict their own access
  ref: KSPP
- option: SECURITY_LOCKDOWN_LSM
  expect: y
  why: Provides lockdown restrictions on access to kernel memory
  ref: KSPP
- option: SECURITY_LOCKDOWN_LSM_EARLY
  expect: y
  why: Initialises lockdown before the other security modules
  ref: KSPP
- option: LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY
  expect: y
  why: Enforces lockdown restrictions on reading and modifying kernel memory
  ref: KSPP
- option: STATIC_USERMODEHELPER
  expect: y
  why: Routes kernel userspace helper requests through a fixed program
  ref: KSPP
