# zlib's copyright strings, deflate_copyright and inflate_copyright, name its version.
package: zlib
cpes: [cpe:2.3:a:zlib:zlib]
evidence:
  - files: [libz.so*]
    pattern: '(?:deflate|inflate) (?P<version>\d+\.\d+(?:\.\d+)*) Copyright'
examples:
  - file: libz.so.1.3.2
    contains: "\xef\x02- deflate 1.3.2 Copyright 1995-2026 Jea"
    version: 1.3.2
